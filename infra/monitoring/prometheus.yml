global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: api
    bearer_token_file: /tmp/metrics.token
    static_configs:
      - targets: [api:8000]
  - job_name: project-health
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets:
          - http://api:8000/health/ready
          - http://asr:8101/health/ready
          - http://vision:8102/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
